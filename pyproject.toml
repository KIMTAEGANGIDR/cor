[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peraturan-crawler"
version = "1.0.0"
description = "Indonesian legal document crawler for peraturan.go.id"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Developer" }
]
keywords = ["crawler", "indonesia", "legal", "peraturan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.23.0",
]
report = [
    "python-docx>=1.1.0",
]
ocr = [
    "pymupdf>=1.24.0",
]
graph = [
    "neo4j>=5.0.0",
]
all = [
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "neo4j>=5.0.0",
]

[project.scripts]
peraturan = "peraturan.src.cli:main"
bpk = "bpk.src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["peraturan", "bpk"]

[tool.pytest.ini_options]
testpaths = ["peraturan/tests", "bpk/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
